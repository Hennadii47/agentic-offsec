[project]
name = "agentic-offsec"
version = "0.1.0"
description = "Autonomous offsec research: supply chain, OAuth logic, cloud exposure, plugin supply chain."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "langgraph>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
vectors = ["chromadb>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
