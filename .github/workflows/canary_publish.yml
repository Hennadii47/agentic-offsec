name: canary-publish
on:
  workflow_dispatch:
    inputs:
      mode: { description: "dry_run or live", default: "dry_run" }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: plan, sign, build, publish, listen
        env:
          CANARY_KEY: ${{ secrets.CANARY_KEY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          python - <<'PY'
          import yaml, pathlib
          from graphs import a_supply_chain as A
          from lib.llm.router import Router
          from lib.opsec import Audit, load_limits
          limits = load_limits()
          limits["canary_key"] = __import__("os").environ.get("CANARY_KEY", "dev-key")
          out = A.build(Router(offline=True), Audit(run_id="ci-publish"), limits).invoke({
              "run_id": "ci-publish", "findings": [],
              "targets": {"repos": ["fixtures/repo-npm"],
                          "org_prefixes": ["@yandex/", "@sber/", "@ozon/"],
                          "hits": "fixtures/hits.jsonl"}})
          for artifact, outcome in out.get("_artifacts", []):
              print(artifact.name, artifact.version, artifact.sha256[:12], outcome.get("command"))
          print("findings", len(out["findings"]),
                "hits", sum(1 for hit in out.get("_hits", []) if hit.verified))
          PY
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
